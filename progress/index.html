<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SalesOS Progress</title>
<style>
:root{--bg:#FAFAFB;--surface:#fff;--subtle:#F4F4F6;--border:#E6E6EA;--text:#16161A;--muted:#5E5E6B;--brand:#6D3AF2;--brand-bg:#F3EEFF;--ok:#12805C;--warn:#B26B00;--bad:#C4261D;--idle:#B4B4C0}
@media(prefers-color-scheme:dark){:root{--bg:#08080A;--surface:#0B0B0E;--subtle:#131318;--border:#23232B;--text:#EDEDF0;--muted:#9A9AA8;--brand:#9B7BFF;--brand-bg:#1A1530;--ok:#3DBE8B;--warn:#E0A030;--bad:#F0645A;--idle:#4A4A55}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/20px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-feature-settings:"tnum"}
header{background:var(--surface);border-bottom:1px solid var(--border)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;flex-wrap:wrap}
h1{font-size:16px;line-height:24px;margin:0;font-weight:600}
.sub{color:var(--muted);font-size:12px}
button{font:inherit;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--subtle)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
main{padding:20px 0 48px}
.focus{border-left:2px solid var(--brand);background:var(--brand-bg);padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:20px}
.focus b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);display:block}
.kpis{display:flex;border:1px solid var(--border);border-radius:8px;background:var(--surface);margin-bottom:20px;flex-wrap:wrap}
.kpi{flex:1 1 140px;padding:12px 16px;border-right:1px solid var(--border)}
.kpi:last-child{border-right:0}
.kpi .n{font-size:22px;line-height:28px;font-weight:600}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{height:4px;background:var(--subtle);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand)}
h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:24px 0 8px}
.panel{border:1px solid var(--border);border-radius:8px;background:var(--surface);overflow:hidden}
details{border-bottom:1px solid var(--border)}details:last-child{border-bottom:0}
summary{display:grid;grid-template-columns:20px 1fr 90px 64px;gap:12px;align-items:center;padding:10px 16px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary:hover{background:var(--subtle)}
.pid{font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
.name{font-weight:500}
.name small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--idle);flex:none}
.done .dot{background:var(--ok)}.in_progress .dot{background:var(--brand)}.blocked .dot{background:var(--bad)}
.pct{text-align:right;color:var(--muted)}
ul{list-style:none;margin:0;padding:4px 16px 12px 48px}
li{display:flex;gap:8px;align-items:center;padding:3px 0}
li.done span:last-child{color:var(--muted);text-decoration:line-through}
.grp{padding:12px 16px;border-bottom:1px solid var(--border)}.grp:last-child{border-bottom:0}
.grp ul{padding:6px 0 0}
.log li{padding:6px 16px;border-bottom:1px solid var(--border)}.log li:last-child{border-bottom:0}.log ul{padding:0}
.log .d{font:12px ui-monospace,Menlo,monospace;color:var(--muted);flex:none}
.err{border:1px solid var(--bad);border-radius:8px;padding:12px 16px;color:var(--bad)}
@media(max-width:600px){summary{grid-template-columns:16px 1fr 56px}.st{display:none}ul{padding-left:36px}.kpi{border-right:0;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<header><div class="wrap top">
  <div><h1 id="title">SalesOS Progress</h1><div class="sub" id="meta">Loading…</div></div>
  <button id="refresh" type="button">Refresh</button>
</div></header>
<main class="wrap" id="app" aria-live="polite"></main>
<script>
const LABEL={done:"Done",in_progress:"In progress",todo:"Not started",blocked:"Blocked"};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dot=s=>`<span class="st ${s}"><i class="dot"></i>${LABEL[s]||s}</span>`;
function phaseStatus(p){const t=p.tasks;if(!t.length)return p.status;
 if(t.every(x=>x.s==="done"))return"done";
 if(t.some(x=>x.s==="blocked")&&!t.some(x=>x.s==="in_progress"||x.s==="done"))return"blocked";
 if(t.some(x=>x.s==="done"||x.s==="in_progress"))return"in_progress";return"todo"}
const pct=p=>p.tasks.length?Math.round(p.tasks.filter(t=>t.s==="done").length/p.tasks.length*100):0;
function render(d){
 document.getElementById("title").textContent=d.project;
 const tasks=d.phases.flatMap(p=>p.tasks),done=tasks.filter(t=>t.s==="done").length;
 const ph=d.phases.filter(p=>phaseStatus(p)==="done").length;
 const items=d.readiness.flatMap(g=>g.items),rd=items.filter(i=>i.done).length;
 const overall=tasks.length?Math.round(done/tasks.length*100):0;
 const when=new Date(d.updated);
 document.getElementById("meta").textContent="Last updated "+when.toLocaleString()+" · checked "+new Date().toLocaleTimeString();
 const open=d.phases.find(p=>phaseStatus(p)==="in_progress")||d.phases.find(p=>phaseStatus(p)==="todo");
 document.getElementById("app").innerHTML=`
 <div class="focus"><b>Current focus</b>${esc(d.currentFocus)}</div>
 <div class="kpis">
  <div class="kpi"><div class="lbl">Overall</div><div class="n">${overall}%</div><div class="bar"><i style="width:${overall}%"></i></div></div>
  <div class="kpi"><div class="lbl">Tasks done</div><div class="n">${done}/${tasks.length}</div></div>
  <div class="kpi"><div class="lbl">Phases done</div><div class="n">${ph}/${d.phases.length}</div></div>
  <div class="kpi"><div class="lbl">Needs from you</div><div class="n">${items.length-rd}</div><div class="sub">${rd}/${items.length} ready</div></div>
 </div>
 <h2>Phases</h2>
 <div class="panel">${d.phases.map(p=>{const s=phaseStatus(p),c=pct(p);
  return `<details ${open&&open.id===p.id?"open":""}><summary>
   <span class="pid">P${p.id}</span>
   <span class="name">${esc(p.name)}<small>${esc(p.objective)}</small></span>
   ${dot(s)}<span class="pct">${c}%</span></summary>
   <ul>${p.tasks.map(t=>`<li class="${t.s}"><span class="st ${t.s}" title="${LABEL[t.s]}"><i class="dot"></i></span><span>${esc(t.t)}</span></li>`).join("")}</ul></details>`}).join("")}</div>
 <h2>Build readiness — needed from you</h2>
 <div class="panel">${d.readiness.map(g=>`<div class="grp"><div class="lbl">${esc(g.group)}</div><ul>${g.items.map(i=>`<li class="${i.done?"done":""}"><span aria-hidden="true">${i.done?"☑":"☐"}</span><span>${esc(i.t)}</span></li>`).join("")}</ul></div>`).join("")}</div>
 <h2>Change log</h2>
 <div class="panel log"><ul>${d.log.map(l=>`<li><span class="d">${esc(l.d)}</span><span>${esc(l.t)}</span></li>`).join("")}</ul></div>`;
}
async function load(){
 try{const r=await fetch("progress.json?"+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);render(await r.json())}
 catch(e){document.getElementById("app").innerHTML='<div class="err">Could not load progress.json ('+esc(e.message)+'). If opened as a local file, serve it over http instead.</div>'}
}
document.getElementById("refresh").onclick=load;
load();setInterval(load,60000);
</script>
</body>
</html>
